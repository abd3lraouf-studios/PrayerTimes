# A maintainer closes an issue from inside their reply: put `/close` on a line of its own.
#
#   /close              -> closed as completed
#   /close not-planned  -> closed as not planned
#   /close duplicate    -> closed as a duplicate
#
# The command line is removed from the comment afterwards, so readers see only the reply.
# Only the repo's owners, org members and collaborators can trigger it.
name: Close on command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  close:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/close')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const command = /^[ \t]*\/close(?:[ \t]+(not-planned|duplicate))?[ \t]*$/mi;
            const body = context.payload.comment.body;
            const match = body.match(command);
            if (!match) {
              core.info('No /close line in the comment; nothing to do.');
              return;
            }
            const reason = match[1] ? match[1].toLowerCase().replace('-', '_') : 'completed';

            const reply = body.replace(command, '').trimEnd();
            if (reply) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: context.payload.comment.id, body: reply });
            } else {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: context.payload.comment.id });
            }

            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: reason,
            });
            core.info(`Closed #${context.issue.number} as ${reason}.`);
